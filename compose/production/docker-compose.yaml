services:
  init-data:
    image: tramposcore:latest
    user: root
    # fix the volume owner, then create or upgrade the database as the node user so its files stay owned by node
    command: sh -c "chown -R 1000:1000 /app/src/data && su node -s /bin/sh -c 'node src/migrate.js'"
    volumes:
      - ./data:/app/src/data
    restart: "no"
  app:
    image: tramposcore:latest
    ports:
      - "80:3000"
    environment:
      SESSION_SECRET: change-me-to-something-long
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me
    command: sh -c "node src/init-admin.js && exec npm start"
    volumes:
      - ./data:/app/src/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    restart: unless-stopped
